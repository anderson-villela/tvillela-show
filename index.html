<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TVillela Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #12141c;
    --surface: #191c27;
    --surface-2: #20232f;
    --border: #2b2f3d;
    --text: #ece9e1;
    --text-muted: #8b8fa3;
    --accent: #ff4b3e;
    --accent-2: #f2c14e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 400;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  button, input, select { font-family: inherit; }
  .tv-header {
    display: flex; align-items: center; gap: 24px; padding: 14px 20px;
    border-bottom: 1px solid var(--border); background: var(--surface);
    position: sticky; top: 0; z-index: 5;
  }
  .tv-brand { display: flex; align-items: center; gap: 9px; }
  .tv-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); flex-shrink: 0; }
  .tv-wordmark { font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
  .tv-tabs { display: flex; gap: 4px; flex: 1; }
  .tv-tab { background: none; border: none; color: var(--text-muted); font-size: 14px; padding: 7px 13px; border-radius: 7px; cursor: pointer; }
  .tv-tab:hover { color: var(--text); background: var(--surface-2); }
  .tv-tab.is-active { color: var(--text); background: var(--surface-2); font-weight: 600; }
  .tv-icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 7px; border-radius: 7px; margin-left: auto; font-size: 16px; line-height: 1; }
  .tv-icon-btn:hover { color: var(--text); background: var(--surface-2); }
  .tv-settings { padding: 16px 20px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
  .tv-label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 7px; }
  .tv-settings-row { display: flex; gap: 8px; }
  .tv-input, .tv-search-input, .tv-select { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 9px 11px; font-size: 14px; }
  .tv-input { flex: 1; }
  .tv-hint { font-size: 12px; color: var(--text-muted); margin: 8px 0 0; }
  .tv-btn { border: none; border-radius: 7px; padding: 9px 16px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .tv-btn-primary { background: var(--accent); color: #1a0e0c; }
  .tv-btn-primary:hover { filter: brightness(1.08); }
  .tv-btn-primary:disabled { opacity: .5; cursor: default; }
  .tv-btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .tv-btn-ghost:hover { background: var(--border); }
  .tv-btn-sm { padding: 7px 12px; font-size: 13px; }
  .tv-main { padding: 20px; max-width: 1000px; margin: 0 auto; }
  .tv-error { background: rgba(255,75,62,.12); border: 1px solid rgba(255,75,62,.35); color: #ff9a90; padding: 10px 14px; border-radius: 7px; font-size: 13px; margin-bottom: 16px; }
  .tv-search-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; margin-bottom: 18px; }
  .tv-search-input { background: none; border: none; flex: 1; padding: 0; font-size: 14px; color: var(--text); }
  .tv-search-input:focus { outline: none; }
  .tv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; }
  .tv-card { display: flex; flex-direction: column; }
  .tv-poster-wrap { position: relative; cursor: pointer; border-radius: 8px; overflow: hidden; background: var(--surface); }
  .tv-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
  .tv-poster-fallback { aspect-ratio: 2/3; background: var(--surface-2); }
  .tv-add-btn { position: absolute; top: 7px; right: 7px; width: 28px; height: 28px; border-radius: 50%; background: rgba(18,20,28,.85); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; }
  .tv-add-btn:hover { background: var(--accent); border-color: var(--accent); color: #1a0e0c; }
  .tv-add-btn.is-added { background: var(--accent-2); border-color: var(--accent-2); color: #1a1204; }
  .tv-card-title { font-size: 13.5px; font-weight: 600; margin-top: 8px; cursor: pointer; line-height: 1.3; }
  .tv-card-title:hover { color: var(--accent-2); }
  .tv-card-year { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .tv-listing { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .tv-listing-row { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer; }
  .tv-listing-row:hover { border-color: #3a3f52; }
  .tv-listing-poster { width: 46px; height: 66px; object-fit: cover; border-radius: 5px; flex-shrink: 0; }
  .tv-listing-info { flex: 1; min-width: 0; }
  .tv-listing-title { font-weight: 600; font-size: 14.5px; margin-bottom: 6px; }
  .tv-progress-track { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .tv-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; }
  .tv-listing-meta { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .tv-empty { color: var(--text-muted); font-size: 14px; text-align: center; padding: 60px 20px; }
  .tv-empty-main { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 90px 20px; color: var(--text-muted); }
  .tv-empty-main h2 { color: var(--text); font-weight: 700; margin: 4px 0 0; }
  .tv-empty-main p { margin: 0 0 6px; max-width: 320px; }
  .tv-back { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; margin-bottom: 16px; padding: 0; }
  .tv-back:hover { color: var(--text); }
  .tv-detail-head { display: flex; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; align-items: flex-start; }
  .tv-detail-poster { width: 130px; border-radius: 9px; flex-shrink: 0; align-self: flex-start; display: block; height: auto; aspect-ratio: 2/3; object-fit: cover; }
  .tv-detail-title { font-size: 25px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.01em; }
  .tv-detail-overview { font-size: 14px; color: var(--text-muted); line-height: 1.55; margin: 0 0 14px; max-width: 60ch; }
  .tv-detail-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; }
  .tv-providers { margin-bottom: 16px; }
  .tv-providers-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; }
  .tv-providers-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .tv-provider-logo { width: 44px; height: 44px; border-radius: 9px; overflow: hidden; display: inline-block; }
  .tv-provider-logo svg { width: 100%; height: 100%; display: block; }
  .tv-season-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .tv-select-wrap { position: relative; }
  .tv-select { appearance: none; padding-right: 30px; cursor: pointer; }
  .tv-episode-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .tv-episode { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); }
  .tv-episode.is-watched { opacity: .55; }
  .tv-episode-still { width: 80px; height: 45px; object-fit: cover; border-radius: 5px; flex-shrink: 0; }
  .tv-episode-info { flex: 1; min-width: 0; }
  .tv-episode-code { font-size: 11px; color: var(--accent-2); font-weight: 700; letter-spacing: .02em; }
  .tv-episode-title { font-size: 14px; font-weight: 600; margin: 2px 0; }
  .tv-episode-date { font-size: 12px; color: var(--text-muted); }
  .tv-check { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border); background: none; color: var(--text); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .tv-check:hover { border-color: var(--accent); }
  .tv-check.is-checked { background: var(--accent); border-color: var(--accent); color: #1a0e0c; }

  .tv-tvtime-card { background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%); border: 1px solid var(--border); border-radius: 14px; padding: 26px; text-align: center; margin-bottom: 20px; }
  .tv-tvtime-label { font-size: 12px; color: var(--text-muted); letter-spacing: 0.02em; margin-bottom: 8px; }
  .tv-tvtime-value { font-size: 40px; font-weight: 800; color: var(--accent-2); }
  .tv-tvtime-value span { font-size: 16px; font-weight: 400; color: var(--text-muted); margin-right: 10px; }
  .tv-tvtime-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }

  .tv-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 30px; }
  .tv-stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
  .tv-stat-value { font-size: 26px; font-weight: 700; }
  .tv-stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .tv-stat-disabled { opacity: 0.55; }

  .tv-section-title { font-size: 18px; font-weight: 700; margin: 30px 0 12px; letter-spacing: -0.01em; }
  .tv-subsection-title { font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; }
  .tv-habits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .tv-bars { display: flex; flex-direction: column; gap: 8px; }
  .tv-bar-row { display: grid; grid-template-columns: 110px 1fr 26px; align-items: center; gap: 8px; margin-bottom: 8px; }
  .tv-bar-label { font-size: 12.5px; color: var(--text-muted); }
  .tv-bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .tv-bar-fill { height: 100%; background: var(--accent-2); border-radius: 4px; }
  .tv-bar-count { font-size: 12px; color: var(--text-muted); text-align: right; }

  .tv-badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .tv-badge { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 10px; text-align: center; opacity: 0.35; filter: grayscale(1); }
  .tv-badge.is-unlocked { opacity: 1; filter: none; border-color: var(--accent-2); }
  .tv-badge-icon { font-size: 24px; margin-bottom: 8px; }
  .tv-badge-label { font-size: 11.5px; color: var(--text-muted); line-height: 1.3; }

  .tv-static-poster { border-radius: 8px; overflow: hidden; background: var(--surface); }

  .tv-status-note { margin-top: 16px; padding: 12px 16px; border-radius: 9px; font-size: 13.5px; line-height: 1.5; }
  .tv-status-ended { background: rgba(242,193,78,.12); border: 1px solid rgba(242,193,78,.35); color: var(--accent-2); }
  .tv-status-returning { background: rgba(255,75,62,.10); border: 1px solid rgba(255,75,62,.3); color: #ff9a90; }

  @media (max-width: 860px) {
    .tv-main { padding: 16px; }
    .tv-habits-grid { grid-template-columns: 1fr; gap: 20px; }
    .tv-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }
  }

  @media (max-width: 640px) {
    .tv-header { flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
    .tv-brand { flex: 1 1 auto; }
    .tv-icon-btn { margin-left: 0; }
    .tv-tabs { order: 3; width: 100%; overflow-x: auto; gap: 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tv-tabs::-webkit-scrollbar { display: none; }
    .tv-tab { padding: 7px 11px; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
    .tv-main { padding: 12px; }
    .tv-settings { padding: 14px; }
    .tv-settings-row { flex-direction: column; align-items: stretch; }
    .tv-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
    .tv-detail-head { flex-direction: column; }
    .tv-detail-poster { width: 140px; align-self: flex-start; }
    .tv-detail-title { font-size: 21px; }
    .tv-season-row { flex-direction: column; align-items: stretch; }
    .tv-select-wrap { width: 100%; }
    .tv-select { width: 100%; }
    .tv-episode-still { width: 64px; height: 36px; }
    .tv-episode-title { font-size: 13px; }
    .tv-listing-row { gap: 10px; padding: 8px; }
    .tv-listing-poster { width: 40px; height: 58px; }
    .tv-tvtime-value { font-size: 30px; }
    .tv-tvtime-value span { font-size: 13px; margin-right: 6px; }
    .tv-stat-grid { grid-template-columns: repeat(2, 1fr); }
    .tv-bar-row { grid-template-columns: 84px 1fr 22px; gap: 6px; }
    .tv-bar-label { font-size: 11.5px; }
    .tv-badges-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 380px) {
    .tv-grid { grid-template-columns: repeat(2, 1fr); }
    .tv-stat-grid { grid-template-columns: 1fr 1fr; }
    .tv-wordmark { font-size: 16px; }
  }
</style>
</head>

function providerLogoKey(name) {
  const n = (name || "").toLowerCase();
  if (n.includes("netflix")) return "netflix";
  if (n.includes("prime")) return "primevideo";
  if (n.includes("disney")) return "disney";
  if (n.includes("hbo") || n.includes("max")) return "hbomax";
  if (n.includes("paramount")) return "paramount";
  if (n.includes("apple")) return "appletv";
  return null;
}

const state = {
  apiKey: localStorage.getItem("tvillela_apiKey") || "",
  library: JSON.parse(localStorage.getItem("tvillela_library") || "null") || { watching: [], watched: {}, lastSeason: {} },
  tab: "catalogo",
  showSettings: false,
  query: "",
  results: null,
  popular: [],
  onAir: [],
  loading: false,
  loadingMore: false,
  error: "",
  detail: null,
  season: null,
  episodes: null,
  popularPage: 0, popularTotalPages: 1,
  onAirPage: 0, onAirTotalPages: 1,
  resultsPage: 0, resultsTotalPages: 1,
  emBreve: null,
  emBreveLoading: false,
  watchProviders: null,
  watchProvidersLoading: false,
};
let searchTimer = null;

function saveLibrary() {
  localStorage.setItem("tvillela_library", JSON.stringify(state.library));
}

async function tmdb(path) {
  const sep = path.includes("?") ? "&" : "?";
  const url = `${TMDB}${path}${sep}api_key=${state.apiKey}&language=pt-BR`;
  let res;
  try {
    res = await fetch(url);
  } catch (e) {
    throw new Error("Não foi possível conectar à TMDB. Verifique sua internet e tente de novo.");
  }
  if (!res.ok) {
    if (res.status === 401) throw new Error("Chave de API inválida. Use a 'API Key (v3 auth)', não o Token de Leitura.");
    throw new Error("Não foi possível buscar os dados agora.");
  }
  return res.json();
}

function isWatching(id) {
  return state.library.watching.some((s) => s.id === id);
}

function watchedCount(seriesId) {
  const seasons = state.library.watched[seriesId] || {};
  return Object.values(seasons).reduce((sum, eps) => sum + Object.keys(eps).length, 0);
}

async function addToWatching(show) {
  state.error = "";
  try {
    let full = show;
    if (!full.number_of_episodes) full = await tmdb(`/tv/${show.id}`);
    const entry = {
      id: full.id, name: full.name, poster_path: full.poster_path,
      number_of_episodes: full.number_of_episodes || 0,
      number_of_seasons: full.number_of_seasons || 1,
      genres: full.genres || [],
      avgRuntime: (full.episode_run_time && full.episode_run_time[0]) || 40,
      addedAt: Date.now(),
    };
    state.library.watching = [entry, ...state.library.watching.filter((s) => s.id !== full.id)];
    saveLibrary();
  } catch (e) { state.error = e.message; }
  render();
}

async function removeFromWatching(id) {
  state.library.watching = state.library.watching.filter((s) => s.id !== id);
  saveLibrary();
  if (state.detail && state.detail.id === id) state.detail = null;
  render();
}

async function openDetail(show, preferredSeason) {
  state.error = ""; state.detail = null; state.episodes = null; state.loading = true;
  state.watchProviders = null; state.watchProvidersLoading = false;
  render();
  try {
    const full = await tmdb(`/tv/${show.id}`);
    state.detail = full;
    const startSeason = preferredSeason ||
      state.library.lastSeason[show.id] ||
      (full.seasons || []).find((s) => s.season_number > 0)?.season_number || 1;
    state.season = startSeason;
    await loadSeason();
    loadWatchProviders(show.id);
  } catch (e) { state.error = e.message; }
  state.loading = false;
  render();
}

async function loadWatchProviders(seriesId) {
  state.watchProvidersLoading = true; render();
  try {
    const d = await tmdb(`/tv/${seriesId}/watch/providers`);
    const region = (d.results && (d.results.BR || d.results.US)) || null;
    const seen = new Set();
    const list = [];
    (region?.flatrate || []).forEach((p) => {
      if (!seen.has(p.provider_id)) { seen.add(p.provider_id); list.push(p); }
    });
    state.watchProviders = list;
  } catch (e) {
    state.watchProviders = [];
  }
  state.watchProvidersLoading = false;
  render();
}

async function loadSeason() {
  if (!state.detail || !state.season) return;
  state.loading = true; state.episodes = null;
  render();
  try {
    const d = await tmdb(`/tv/${state.detail.id}/season/${state.season}`);
    state.episodes = d.episodes || [];
    state.library.lastSeason[state.detail.id] = state.season;
    saveLibrary();
  } catch (e) { state.error = e.message; }
  state.loading = false;
  render();
}

async function toggleEpisode(seriesId, seasonNumber, episodeNumber) {
  const seasons = state.library.watched[seriesId] || (state.library.watched[seriesId] = {});
  const eps = seasons[seasonNumber] || (seasons[seasonNumber] = {});
  const ep = (state.episodes || []).find((e) => e.episode_number === episodeNumber);
  if (eps[episodeNumber]) {
    delete eps[episodeNumber];
  } else {
    eps[episodeNumber] = { runtime: ep && ep.runtime ? ep.runtime : null, watchedAt: Date.now() };
    const earlierUnwatched = (state.episodes || []).some(
      (e) => e.episode_number < episodeNumber && !eps[e.episode_number]
    );
    if (earlierUnwatched) {
      const fillIn = confirm(
        "Você também já assistiu aos episódios anteriores desta temporada? Clique OK para marcar todos até este como vistos."
      );
      if (fillIn) {
        const now = Date.now();
        (state.episodes || []).forEach((e) => {
          if (e.episode_number <= episodeNumber && !eps[e.episode_number]) {
            eps[e.episode_number] = { runtime: e.runtime || null, watchedAt: now };
          }
        });
      }
    }
  }
  saveLibrary();
  render();
}

async function completeSeries(seriesId) {
  const confirmed = confirm("Marcar TODOS os episódios de TODAS as temporadas desta série como assistidos?");
  if (!confirmed) return;
  const d = state.detail;
  if (!d) return;
  const w = state.library.watching.find((s) => s.id === seriesId);
  const seasonsWatched = state.library.watched[seriesId] || (state.library.watched[seriesId] = {});
  const now = Date.now();
  (d.seasons || []).forEach((season) => {
    if (season.season_number === 0) return;
    const eps = seasonsWatched[season.season_number] || (seasonsWatched[season.season_number] = {});
    for (let n = 1; n <= (season.episode_count || 0); n++) {
      eps[n] = { runtime: (w && w.avgRuntime) || 40, watchedAt: now };
    }
  });
  saveLibrary();
  render();
}

async function markSeasonWatched(seriesId, seasonNumber, allEpisodeNumbers) {
  const seasons = state.library.watched[seriesId] || (state.library.watched[seriesId] = {});
  const currentlyAll = allEpisodeNumbers.every((n) => seasons[seasonNumber] && seasons[seasonNumber][n]);
  seasons[seasonNumber] = {};
  if (!currentlyAll) {
    const now = Date.now();
    allEpisodeNumbers.forEach((n) => {
      const ep = (state.episodes || []).find((e) => e.episode_number === n);
      seasons[seasonNumber][n] = { runtime: ep && ep.runtime ? ep.runtime : null, watchedAt: now };
    });
  }
  saveLibrary();
  render();
}

async function loadCatalogIfNeeded() {
  if (!state.apiKey) return;
  if (state.tab === "catalogo" && !state.query && state.popular.length === 0) {
    state.loading = true; render();
    try {
      const d = await tmdb("/tv/popular?page=1");
      state.popular = d.results || []; state.popularPage = 1; state.popularTotalPages = d.total_pages || 1;
    } catch (e) { state.error = e.message; }
    state.loading = false; render();
  }
  if (state.tab === "novidades" && state.onAir.length === 0) {
    state.loading = true; render();
    try {
      const d = await tmdb("/tv/on_the_air?page=1");
      state.onAir = d.results || []; state.onAirPage = 1; state.onAirTotalPages = d.total_pages || 1;
    } catch (e) { state.error = e.message; }
    state.loading = false; render();
  }
}

function runSearch() {
  clearTimeout(searchTimer);
  if (!state.query.trim()) { state.results = null; render(); return; }
  searchTimer = setTimeout(async () => {
    state.loading = true; render();
    try {
      const d = await tmdb(`/search/tv?query=${encodeURIComponent(state.query)}&page=1`);
      state.results = d.results || []; state.resultsPage = 1; state.resultsTotalPages = d.total_pages || 1;
    } catch (e) { state.error = e.message; }
    state.loading = false; render();
  }, 400);
}

async function loadMore() {
  state.loadingMore = true; render();
  try {
    if (state.tab === "catalogo" && state.query && state.results !== null) {
      if (state.resultsPage >= state.resultsTotalPages) return;
      const d = await tmdb(`/search/tv?query=${encodeURIComponent(state.query)}&page=${state.resultsPage + 1}`);
      state.results = state.results.concat(d.results || []); state.resultsPage += 1;
    } else if (state.tab === "catalogo") {
      if (state.popularPage >= state.popularTotalPages) return;
      const d = await tmdb(`/tv/popular?page=${state.popularPage + 1}`);
      state.popular = state.popular.concat(d.results || []); state.popularPage += 1;
    } else if (state.tab === "novidades") {
      if (state.onAirPage >= state.onAirTotalPages) return;
      const d = await tmdb(`/tv/on_the_air?page=${state.onAirPage + 1}`);
      state.onAir = state.onAir.concat(d.results || []); state.onAirPage += 1;
    }
  } catch (e) { state.error = e.message; }
  state.loadingMore = false; render();
}

async function loadEmBreve() {
  if (!state.apiKey) return;
  state.emBreveLoading = true; state.emBreve = []; render();
  const found = [];
  for (const w of state.library.watching) {
    try {
      const fresh = await tmdb(`/tv/${w.id}`);
      const knownSeasons = w.number_of_seasons || 1;
      if (fresh.number_of_seasons > knownSeasons) {
        const newSeasonNum = fresh.number_of_seasons;
        const seasonInfo = (fresh.seasons || []).find((s) => s.season_number === newSeasonNum);
        found.push({
          id: w.id,
          name: fresh.name,
          poster_path: fresh.poster_path,
          newSeasonNum,
          seasonName: seasonInfo ? seasonInfo.name : `Temporada ${newSeasonNum}`,
          episodeCount: seasonInfo ? seasonInfo.episode_count : null,
          airDate: seasonInfo ? seasonInfo.air_date : null,
        });
      }
    } catch (e) { /* skip series that fail to load, keep checking the rest */ }
  }
  state.emBreve = found;
  state.emBreveLoading = false;
  render();
}

async function openFromEmBreve(item) {
  const w = state.library.watching.find((s) => s.id === item.id);
  if (w) { w.number_of_seasons = Math.max(w.number_of_seasons || 1, item.newSeasonNum); saveLibrary(); }
  openDetail({ id: item.id }, item.newSeasonNum);
}

const WEEKDAY_LABELS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const TIME_BUCKETS = [
  { label: "Madrugada (0h–6h)", test: (h) => h >= 0 && h < 6 },
  { label: "Manhã (6h–12h)", test: (h) => h >= 6 && h < 12 },
  { label: "Tarde (12h–18h)", test: (h) => h >= 12 && h < 18 },
  { label: "Noite (18h–24h)", test: (h) => h >= 18 && h < 24 },
];

function computeStats() {
  let totalEpisodes = 0;
  let totalMinutes = 0;
  let trackedTimestamps = 0;
  const weekdayCounts = [0, 0, 0, 0, 0, 0, 0];
  const timeCounts = TIME_BUCKETS.map(() => 0);
  const genreWeights = {};

  for (const w of state.library.watching) {
    const seasons = state.library.watched[w.id] || {};
    let epsForSeries = 0;
    for (const seasonNum of Object.keys(seasons)) {
      for (const epNum of Object.keys(seasons[seasonNum])) {
        const raw = seasons[seasonNum][epNum];
        totalEpisodes += 1;
        epsForSeries += 1;
        const runtime = raw && typeof raw === "object" && raw.runtime ? raw.runtime : (w.avgRuntime || 40);
        totalMinutes += runtime;
        const watchedAt = raw && typeof raw === "object" ? raw.watchedAt : null;
        if (watchedAt) {
          trackedTimestamps += 1;
          const d = new Date(watchedAt);
          weekdayCounts[d.getDay()] += 1;
          const hour = d.getHours();
          const bucketIdx = TIME_BUCKETS.findIndex((b) => b.test(hour));
          if (bucketIdx >= 0) timeCounts[bucketIdx] += 1;
        }
      }
    }
    (w.genres || []).forEach((g) => {
      genreWeights[g.name] = (genreWeights[g.name] || 0) + epsForSeries;
    });
  }

  const completeSeries = state.library.watching.filter(
    (w) => w.number_of_episodes > 0 && watchedCount(w.id) >= w.number_of_episodes
  ).length;

  const topGenres = Object.entries(genreWeights)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 6)
    .map(([name, count]) => ({ name, count }));

  const days = Math.floor(totalMinutes / 1440);
  const hours = Math.floor((totalMinutes % 1440) / 60);
  const minutes = totalMinutes % 60;

  const badges = [
    { icon: "🎬", label: "Primeiro episódio", unlocked: totalEpisodes >= 1 },
    { icon: "🍿", label: "Maratonista Jr. (25 eps)", unlocked: totalEpisodes >= 25 },
    { icon: "📺", label: "Maratonista (100 eps)", unlocked: totalEpisodes >= 100 },
    { icon: "🏆", label: "Lenda do Streaming (500 eps)", unlocked: totalEpisodes >= 500 },
    { icon: "✅", label: "Primeira série completa", unlocked: completeSeries >= 1 },
    { icon: "📚", label: "Colecionador (5 séries)", unlocked: state.library.watching.length >= 5 },
    { icon: "🗂️", label: "Curador (15 séries)", unlocked: state.library.watching.length >= 15 },
    { icon: "⏳", label: "100 horas de tela", unlocked: totalMinutes >= 6000 },
  ];

  return {
    totalEpisodes, totalMinutes, days, hours, minutes,
    seriesCount: state.library.watching.length, completeSeries,
    weekdayCounts, timeCounts, trackedTimestamps, topGenres, badges,
  };
}

function esc(s) { return (s || "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderHeader() {

function posterCard(s) {
  const added = isWatching(s.id);
  return `
  <div class="tv-card">
    <div class="tv-poster-wrap" data-open="${s.id}">
      ${s.poster_path ? `<img class="tv-poster" src="${IMG}${s.poster_path}" alt="">` : `<div class="tv-poster tv-poster-fallback"></div>`}

function barRow(label, count, max) {
  const pct = max > 0 ? Math.max(4, Math.round((count / max) * 100)) : 0;
  return `
  <div class="tv-bar-row">
    <div class="tv-bar-label">${esc(label)}</div>
    <div class="tv-bar-track"><div class="tv-bar-fill" style="width:${pct}%"></div></div>
    <div class="tv-bar-count">${count}</div>
  </div>`;
}

function renderProfile(errorHtml) {
  const s = computeStats();

  const maxTime = Math.max(1, ...s.timeCounts);
  const maxGenre = s.topGenres.length ? Math.max(...s.topGenres.map((g) => g.count)) : 1;

  const habitsNote = s.trackedTimestamps === 0
    ? `<p class="tv-hint">Ainda sem dados de horário — hábitos são calculados a partir de episódios marcados a partir de agora.</p>`
    : "";

  const postersGrid = state.library.watching.length
    ? `<div class="tv-grid">${state.library.watching.map((w) => `
        <div class="tv-static-poster">
          ${w.poster_path ? `<img class="tv-poster" src="${IMG}${w.poster_path}" alt="${esc(w.name)}">` : `<div class="tv-poster tv-poster-fallback"></div>`}
        </div>`).join("")}</div>`
    : `<div class="tv-empty">Sua lista está vazia.</div>`;

  return `<main class="tv-main">
    ${errorHtml}

    <div class="tv-tvtime-card">
      <div class="tv-tvtime-label">TV Time</div>
      <div class="tv-tvtime-value">${s.days}<span>d</span> ${s.hours}<span>h</span> ${s.minutes}<span>min</span></div>
      <div class="tv-tvtime-sub">tempo total assistido, com base na duração dos episódios</div>
    </div>

    <div class="tv-stat-grid">
      <div class="tv-stat-card"><div class="tv-stat-value">${s.totalEpisodes}</div><div class="tv-stat-label">episódios assistidos</div></div>
      <div class="tv-stat-card"><div class="tv-stat-value">${s.completeSeries}</div><div class="tv-stat-label">séries completas</div></div>
      <div class="tv-stat-card"><div class="tv-stat-value">${s.seriesCount}</div><div class="tv-stat-label">séries acompanhadas</div></div>
      <div class="tv-stat-card tv-stat-disabled"><div class="tv-stat-value">—</div><div class="tv-stat-label">filmes assistidos (em breve)</div></div>
    </div>

    <h3 class="tv-section-title">Hábitos</h3>
    ${habitsNote}
    <div class="tv-habits-grid">
      <div>
        <div class="tv-subsection-title">Dia da semana</div>
        ${WEEKDAY_LABELS.map((label, i) => barRow(label, s.weekdayCounts[i], maxWeekday)).join("")}
      </div>
      <div>
        <div class="tv-subsection-title">Horário</div>
        ${TIME_BUCKETS.map((b, i) => barRow(b.label, s.timeCounts[i], maxTime)).join("")}
      </div>
    </div>

    <h3 class="tv-section-title">Gêneros mais assistidos</h3>
    ${s.topGenres.length
      ? `<div class="tv-bars">${s.topGenres.map((g) => barRow(g.name, g.count, maxGenre)).join("")}</div>`
      : `<p class="tv-hint">Adicione séries e marque episódios para ver seus gêneros favoritos aqui.</p>`}
    <p class="tv-hint">Atores/personagens favoritos dependeriam de um recurso de votação da comunidade, que este app não tem — não disponível por enquanto.</p>

    <h3 class="tv-section-title">Conquistas</h3>
    <div class="tv-badges-grid">
      ${s.badges.map((b) => `
        <div class="tv-badge ${b.unlocked ? "is-unlocked" : ""}">
          <div class="tv-badge-icon">${b.icon}</div>
          <div class="tv-badge-label">${esc(b.label)}</div>
        </div>`).join("")}
    </div>

    <h3 class="tv-section-title">Minha Lista</h3>
    ${postersGrid}
  </main>`;
}

function renderMain() {
  if (!state.apiKey) {
    return `<div class="tv-empty tv-empty-main">
      <div style="font-size:26px">📡</div>
      <h2>Antes de começar</h2>
      <p>Cole sua chave de API da TMDB nas configurações para carregar o catálogo.</p>
      <button class="tv-btn tv-btn-primary" id="openSettingsBtn">Abrir configurações</button>
    </div>`;
  }

  if (state.detail) return renderDetail();

  const errorHtml = state.error ? `<div class="tv-error">${esc(state.error)}</div>` : "";

  if (state.tab === "perfil") return renderProfile(errorHtml);

  if (state.tab === "assistindo") {
    if (state.library.watching.length === 0) {
      return `<main class="tv-main">${errorHtml}<div class="tv-empty">Sua lista está vazia. Adicione séries pelo Catálogo ou Novidades.</div></main>`;
    }
    const rows = state.library.watching.map((s) => {
      const watched = watchedCount(s.id);
      const total = s.number_of_episodes || 0;
      const pct = total ? Math.min(100, Math.round((watched / total) * 100)) : 0;
      return `
      <li class="tv-listing-row" data-open="${s.id}">
        ${s.poster_path ? `<img class="tv-listing-poster" src="${IMG}${s.poster_path}" alt="">` : `<div class="tv-listing-poster tv-poster-fallback"></div>`}
        <div class="tv-listing-info">
          <div class="tv-listing-title">${esc(s.name)}</div>
          <div class="tv-progress-track"><div class="tv-progress-fill" style="width:${pct}%"></div></div>
          <div class="tv-listing-meta">${watched} de ${total || "?"} episódios vistos</div>
        </div>
        <button class="tv-icon-btn" data-remove="${s.id}">🗑</button>
      </li>`;
    }).join("");
    return `<main class="tv-main">${errorHtml}<ul class="tv-listing">${rows}</ul></main>`;
  }

  if (state.tab === "embreve") {
    if (state.library.watching.length === 0) {
      return `<main class="tv-main">${errorHtml}<div class="tv-empty">Adicione séries à Minha Lista para acompanhar novas temporadas aqui.</div></main>`;
    }
    if (state.emBreveLoading || state.emBreve === null) {
      return `<main class="tv-main">${errorHtml}<div class="tv-empty">Verificando novidades das suas séries…</div></main>`;
    }
    if (state.emBreve.length === 0) {
      return `<main class="tv-main">${errorHtml}<div class="tv-empty">Nenhuma novidade por enquanto. Suas séries seguem nas temporadas que você já conhece.</div></main>`;
    }
    const rows = state.emBreve.map((item) => {
      const notYetAired = item.airDate && item.airDate > TODAY_STR;
      const tag = notYetAired ? "Temporada anunciada" : "Nova temporada disponível";
      return `
      <li class="tv-listing-row" data-embreve="${item.id}" data-newseason="${item.newSeasonNum}">
        ${item.poster_path ? `<img class="tv-listing-poster" src="${IMG}${item.poster_path}" alt="">` : `<div class="tv-listing-poster tv-poster-fallback"></div>`}
        <div class="tv-listing-info">
          <div class="tv-listing-title">${esc(item.name)}</div>
          <div class="tv-listing-meta">
            ${tag} · ${esc(item.seasonName)}${item.episodeCount ? ` · ${item.episodeCount} episódios` : ""}${item.airDate ? ` · estreia ${item.airDate}` : " · data ainda não anunciada"}
          </div>
        </div>
      </li>`;
    }).join("");
    return `<main class="tv-main">${errorHtml}<ul class="tv-listing">${rows}</ul></main>`;
  }

  const grid = state.tab === "catalogo" ? (state.results !== null ? state.results : state.popular) : state.onAir;
  const searchRow = state.tab === "catalogo" ? `
    <div class="tv-search-row">
      🔍
      <input class="tv-search-input" id="searchInput" placeholder="Buscar uma série…" value="${esc(state.query)}" />
      ${state.query ? `<button class="tv-icon-btn" id="clearSearchBtn">×</button>` : ""}
    </div>` : "";

  const hasMore = state.tab === "catalogo"
    ? (state.query && state.results !== null ? state.resultsPage < state.resultsTotalPages : state.popularPage < state.popularTotalPages)
    : state.onAirPage < state.onAirTotalPages;

  let body;
  if (state.loading && grid.length === 0) body = `<div class="tv-empty">Carregando…</div>`;
  else if (!state.loading && grid.length === 0) body = `<div class="tv-empty">Nenhum resultado encontrado.</div>`;
  else body = `<div class="tv-grid">${grid.map(posterCard).join("")}</div>
    ${hasMore ? `<div style="text-align:center;margin-top:24px">
      <button class="tv-btn tv-btn-ghost" id="loadMoreBtn" ${state.loadingMore ? "disabled" : ""}>${state.loadingMore ? "Carregando…" : "Carregar mais"}</button>
    </div>` : ""}`;

  return `<main class="tv-main">${errorHtml}${searchRow}${body}</main>`;
}

function seriesStatusNote(d) {
  const status = d.status || "";
  const ended = status === "Ended" || status === "Canceled";
  if (ended) {
    const label = status === "Canceled" ? "cancelada" : "encerrada";
    return `<div class="tv-status-note tv-status-ended">🏁 Série ${label} — você assistiu tudo que existe até agora.</div>`;
  }
  const next = d.next_episode_to_air;
  if (next && next.air_date) {
    return `<div class="tv-status-note tv-status-returning">📡 Série segue ativa — próximo episódio previsto para ${next.air_date}.</div>`;
  }
  return `<div class="tv-status-note tv-status-returning">📡 Série segue ativa, com novas temporadas possíveis — ainda sem data de estreia anunciada.</div>`;
}

function renderDetail() {
  const d = state.detail;
  const seasons = (d.seasons || []).filter((s) => s.season_number > 0 || d.seasons.length === 1);
  const watchedMap = (state.library.watched[d.id] || {})[state.season] || {};
  const eps = state.episodes || [];
  const allWatched = eps.length > 0 && eps.every((e) => watchedMap[e.episode_number]);
  const errorHtml = state.error ? `<div class="tv-error">${esc(state.error)}</div>` : "";

  const releasedSeasons = seasons.filter((s) => s.air_date && s.air_date <= TODAY_STR);
  const latestReleasedSeasonNum = releasedSeasons.length
    ? Math.max(...releasedSeasons.map((s) => s.season_number))
    : Math.max(0, ...seasons.map((s) => s.season_number));
  const showStatusNote = allWatched && state.season === latestReleasedSeasonNum;

  const episodeItems = eps.map((ep) => {
    const watched = !!watchedMap[ep.episode_number];
    return `
    <li class="tv-episode ${watched ? "is-watched" : ""}">
      ${ep.still_path ? `<img class="tv-episode-still" src="${STILL}${ep.still_path}" alt="">` : `<div class="tv-episode-still tv-poster-fallback"></div>`}
      <div class="tv-episode-info">
        <div class="tv-episode-code">S${String(state.season).padStart(2,"0")}E${String(ep.episode_number).padStart(2,"0")}</div>
        <div class="tv-episode-title">${esc(ep.name)}</div>
        ${ep.air_date ? `<div class="tv-episode-date">${ep.air_date}</div>` : ""}
      </div>
      <button class="tv-check ${watched ? "is-checked" : ""}" data-toggle-ep="${ep.episode_number}">${watched ? "✓" : ""}</button>
    </li>`;
  }).join("");

  return `<main class="tv-main">
    <button class="tv-back" id="backBtn">← Voltar</button>
    ${errorHtml}
    <div class="tv-detail-head">
      ${d.poster_path ? `<img class="tv-detail-poster" src="${IMG}${d.poster_path}" alt="">` : ""}
      <div>
        <h1 class="tv-detail-title">${esc(d.name)}</h1>
        <div class="tv-detail-meta">
          ${(d.genres || []).length ? `<span>${esc(d.genres.map((g) => g.name).join(", "))}</span>` : ""}
          ${d.vote_average ? `<span>⭐ ${d.vote_average.toFixed(1)}</span>` : ""}
          <span>Criado por: ${(d.created_by && d.created_by.length) ? esc(d.created_by.map((c) => c.name).join(", ")) : "não informado"}</span>
        </div>
        <p class="tv-detail-overview">${esc(d.overview) || "Sem sinopse disponível."}</p>
        <div class="tv-providers">
          <div class="tv-providers-label">Onde assistir</div>
          ${state.watchProvidersLoading
            ? `<div class="tv-hint">Verificando plataformas…</div>`
            : (state.watchProviders && state.watchProviders.length
                ? `<div class="tv-providers-row">${state.watchProviders.map((p) => {
                    const key = providerLogoKey(p.provider_name);
                    if (key && STREAMING_LOGOS[key]) {
                      return `<div class="tv-provider-logo" title="${esc(p.provider_name)}">${STREAMING_LOGOS[key]}</div>`;
                    }
                    return `<img class="tv-provider-logo" src="${IMG.replace("w342","w92")}${p.logo_path}" alt="${esc(p.provider_name)}" title="${esc(p.provider_name)}">`;
                  }).join("")}</div><p class="tv-hint">Dados de streaming via JustWatch, por região.</p>`
                : `<p class="tv-hint">Não encontrado em nenhum serviço de streaming por assinatura no momento.</p>`)}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="tv-btn ${isWatching(d.id) ? "tv-btn-ghost" : "tv-btn-primary"}" id="toggleWatchBtn">
            ${isWatching(d.id) ? "Remover da Minha Lista" : "Adicionar à Minha Lista"}
          </button>
          ${isWatching(d.id) ? `<button class="tv-btn tv-btn-ghost" id="completeSeriesBtn">Concluir série</button>` : ""}
        </div>
      </div>
    </div>
    <div class="tv-season-row">
      <div class="tv-select-wrap">
        <select class="tv-select" id="seasonSelect">
          ${seasons.map((s) => `<option value="${s.season_number}" ${s.season_number === state.season ? "selected" : ""}>${esc(s.name)} (${s.episode_count} eps)</option>`).join("")}
        </select>
      </div>
      ${eps.length > 0 ? `<button class="tv-btn tv-btn-ghost tv-btn-sm" id="markSeasonBtn">${allWatched ? "Desmarcar temporada assistida" : "Marcar temporada como assistida"}</button>` : ""}
    </div>
    ${state.loading && !state.episodes ? `<div class="tv-empty">Carregando episódios…</div>` : `<ul class="tv-episode-list">${episodeItems}</ul>`}
    ${showStatusNote ? seriesStatusNote(d) : ""}
  </main>`;
}

function render() {
  const prevActive = document.activeElement;
  const wasSearchFocused = !!(prevActive && prevActive.id === "searchInput");
  const cursorPos = wasSearchFocused ? prevActive.selectionStart : null;
  document.getElementById("app").innerHTML = renderHeader() + renderMain();
  bindEvents();
  if (wasSearchFocused) {
    const searchInput = document.getElementById("searchInput");
    if (searchInput) {
      searchInput.focus({ preventScroll: true });
      searchInput.setSelectionRange(cursorPos, cursorPos);
    }
  }
}

function bindEvents() {
  const app = document.getElementById("app");
  const settingsBtn = document.getElementById("settingsBtn");
  if (settingsBtn) settingsBtn.onclick = () => { state.showSettings = !state.showSettings; render(); };
  const openSettingsBtn = document.getElementById("openSettingsBtn");
  if (openSettingsBtn) openSettingsBtn.onclick = () => { state.showSettings = true; render(); };
  const saveKeyBtn = document.getElementById("saveKeyBtn");
  if (saveKeyBtn) saveKeyBtn.onclick = () => {
    const val = document.getElementById("keyInput").value.trim();
    state.apiKey = val;
    localStorage.setItem("tvillela_apiKey", val);
    state.showSettings = false;
    state.popular = []; state.onAir = [];
    render();
    loadCatalogIfNeeded();
  };

  app.querySelectorAll("[data-tab]").forEach((el) => {
    el.onclick = () => {
      state.tab = el.getAttribute("data-tab");
      state.detail = null;
      render();
      if (state.tab === "embreve") loadEmBreve();
      else loadCatalogIfNeeded();
    };
  });

  const searchInput = document.getElementById("searchInput");
  if (searchInput) {
    searchInput.oninput = (e) => { state.query = e.target.value; runSearch(); };
  }
  const clearSearchBtn = document.getElementById("clearSearchBtn");
  if (clearSearchBtn) clearSearchBtn.onclick = () => { state.query = ""; state.results = null; render(); };
  const loadMoreBtn = document.getElementById("loadMoreBtn");
  if (loadMoreBtn) loadMoreBtn.onclick = () => loadMore();

  app.querySelectorAll("[data-open]").forEach((el) => {
    el.onclick = () => {
      const id = Number(el.getAttribute("data-open"));
      const source = [...state.popular, ...state.onAir, ...(state.results || []), ...state.library.watching];
      const show = source.find((s) => s.id === id);
      if (show) openDetail(show);
    };
  });
  app.querySelectorAll("[data-add]").forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = Number(el.getAttribute("data-add"));
      if (isWatching(id)) return;
      const source = [...state.popular, ...state.onAir, ...(state.results || [])];
      const show = source.find((s) => s.id === id);
      if (show) addToWatching(show);
    };
  });
  app.querySelectorAll("[data-remove]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); removeFromWatching(Number(el.getAttribute("data-remove"))); };
  });
  app.querySelectorAll("[data-embreve]").forEach((el) => {
    el.onclick = () => {
      const id = Number(el.getAttribute("data-embreve"));
      const newSeasonNum = Number(el.getAttribute("data-newseason"));
      const item = (state.emBreve || []).find((i) => i.id === id);
      if (item) openFromEmBreve(item);
      else openFromEmBreve({ id, newSeasonNum });
    };
  });

  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.onclick = () => { state.detail = null; render(); };
  const toggleWatchBtn = document.getElementById("toggleWatchBtn");
  if (toggleWatchBtn) toggleWatchBtn.onclick = () => isWatching(state.detail.id) ? removeFromWatching(state.detail.id) : addToWatching(state.detail);
  const completeSeriesBtn = document.getElementById("completeSeriesBtn");
  if (completeSeriesBtn) completeSeriesBtn.onclick = () => completeSeries(state.detail.id);
  const seasonSelect = document.getElementById("seasonSelect");
  if (seasonSelect) seasonSelect.onchange = (e) => { state.season = Number(e.target.value); loadSeason(); };
  const markSeasonBtn = document.getElementById("markSeasonBtn");
  if (markSeasonBtn) markSeasonBtn.onclick = () => markSeasonWatched(state.detail.id, state.season, state.episodes.map((e) => e.episode_number));
  app.querySelectorAll("[data-toggle-ep]").forEach((el) => {
    el.onclick = () => toggleEpisode(state.detail.id, state.season, Number(el.getAttribute("data-toggle-ep")));
  });
}

render();
loadCatalogIfNeeded();
</script>
</body>
</html>
